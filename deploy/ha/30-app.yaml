apiVersion: v1
kind: Namespace
metadata:
  name: todo-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-app-config
  namespace: todo-app
data:
  TODO_SERVICE_URL: http://todo-service:3000
  CATEGORY_SERVICE_URL: http://category-service:3000
  JWT_TTL_SECONDS: "3600"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: user-service
  namespace: todo-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: user-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: todo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: user-service
      containers:
        - name: user-service
          image: todo-app/user-service:ha-20261024
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: todo-app-secrets
                  key: JWT_SECRET
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-app-secrets
                  key: USER_DB_PASSWORD
            - name: DATABASE_URL
              value: postgres://user_svc:$(DB_PASSWORD)@todo-pg-rw:5432/users
            - name: JWT_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: JWT_TTL_SECONDS
            - name: TODO_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: TODO_SERVICE_URL
            - name: CATEGORY_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: CATEGORY_SERVICE_URL
          lifecycle:
            preStop:
              exec:
                command:
                  - sleep
                  - "3"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 192Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: 3000
            periodSeconds: 5
            failureThreshold: 36
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: todo-app
spec:
  selector:
    app: user-service
  ports:
    - port: 3000
---
