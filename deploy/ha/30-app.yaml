apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  namespace: todo-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: todo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: todo-app/gateway:ha-20261024
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: USER_UPSTREAM_1
              value: user-service.todo-app.svc.cluster.local:3000
            - name: USER_UPSTREAM_2
              value: user-service.todo-app.svc.cluster.local:3000
            - name: TODO_UPSTREAM_1
              value: todo-service.todo-app.svc.cluster.local:3000
            - name: TODO_UPSTREAM_2
              value: todo-service.todo-app.svc.cluster.local:3000
            - name: CATEGORY_UPSTREAM_1
              value: category-service.todo-app.svc.cluster.local:3000
            - name: CATEGORY_UPSTREAM_2
              value: category-service.todo-app.svc.cluster.local:3000
            - name: STATS_UPSTREAM_1
              value: stats-service.todo-app.svc.cluster.local:3000
            - name: STATS_UPSTREAM_2
              value: stats-service.todo-app.svc.cluster.local:3000
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: runtime-config
              mountPath: /usr/share/nginx/html/runtime-config.js
              subPath: runtime-config.js
              readOnly: true
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: gateway
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      volumes:
        - name: runtime-config
          configMap:
            name: todo-runtime-config
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: todo-app
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8080
      nodePort: 30080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-runtime-config
  namespace: todo-app
data:
  runtime-config.js: |
    window.TODO_API_ORIGINS = ["http://10.4.31.11:30080","http://10.4.31.13:30080","http://10.4.31.16:30080","http://10.4.31.17:30080"];
