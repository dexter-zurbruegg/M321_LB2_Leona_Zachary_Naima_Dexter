# stats-service EINZELN starten (N01):  docker compose --env-file ../../.env up -d --build  ->  http://<vm-ip>:8084/health
# Braucht keine Datenbank. TODO- und Kategorien-Service findet er über TODO_SERVICE_URL / CATEGORY_SERVICE_URL.
name: stats-service
services:
  stats-service:
    build: .
    image: todo-app/stats-service:1.0
    restart: always
    ports: ["${STATS_PORT:-8084}:3000"]
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET fehlt}
      TODO_SERVICE_URL: ${TODO_SERVICE_URL:-http://host.docker.internal:8082}
      CATEGORY_SERVICE_URL: ${CATEGORY_SERVICE_URL:-http://host.docker.internal:8083}
      SERVICE_TIMEOUT_MS: ${SERVICE_TIMEOUT_MS:-2000}
    extra_hosts: ["host.docker.internal:host-gateway"]
