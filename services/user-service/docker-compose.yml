# user-service EINZELN starten (N01), z. B. auf der eigenen LernMAAS-VM:
#   docker compose --env-file ../../.env up -d --build   ->  http://<vm-ip>:8081/health
# Bringt seine eigene Datenbank mit. Andere Services werden über *_SERVICE_URL gefunden
# (Standard: dieselbe VM über die Host-Ports, sonst IP der anderen VM eintragen).
name: user-service
services:
  user-service:
    build: .
    image: todo-app/user-service:1.0
    restart: always
    ports: ["8081:3000"]
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt (.env nach ~/m321/.env kopieren)}@db:5432/users
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET fehlt}
      TODO_SERVICE_URL: ${TODO_SERVICE_URL:-http://host.docker.internal:8082}
      CATEGORY_SERVICE_URL: ${CATEGORY_SERVICE_URL:-http://host.docker.internal:8083}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt (.env nach ~/m321/.env kopieren)}
      POSTGRES_DB: users
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 5s
      retries: 10
volumes:
  db-data:
